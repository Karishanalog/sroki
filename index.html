<body>

/* Стиль Instagram is_karisha: бледно-розовый фон, пыльная роза, шоколадно-сливовый текст, жирные заголовки, плашки капсом */
:root{
  --bg:#FDEDEE; --surface:#FFFFFF; --surface-2:#FDF4F4; --line:#F3DCE1;
  --ink:#382828; --muted:#8C7377; --accent:#C86880; --accent-dark:#B05570; --accent-ink:#FFFFFF; --accent-soft:#F8E0E8;
  --ok:#3E7457; --ok-bg:#E2EFE5; --warn:#9A6417; --warn-bg:#FBEBD3; --bad:#B42F2F; --bad-bg:#F9D9D6;
  --k-rep:#B05570; --k-rep-bg:#F8E0E8; --k-not:#8E6533; --k-not-bg:#F7EADB; --k-pay:#5E3443; --k-pay-bg:#EEDDE3; --k-sal:#6B5A88; --k-sal-bg:#ECE6F3;
  --shadow:0 6px 22px rgb(56 40 40 / .07);
  --f-display:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --f-body:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1416; --surface:#2A1D20; --surface-2:#332428; --line:#432F34;
  --ink:#F7E9EC; --muted:#B79CA2; --accent:#E58FA5; --accent-dark:#F0A9BA; --accent-ink:#1D1416; --accent-soft:#4A2A33;
  --ok:#8CC9A3; --ok-bg:#1F3428; --warn:#E9BE73; --warn-bg:#3B2C17; --bad:#F2928A; --bad-bg:#4B1F1D;
  --k-rep:#F0A9BA; --k-rep-bg:#4A2A33; --k-not:#E2C08E; --k-not-bg:#3A2D1F; --k-pay:#E3C3CE; --k-pay-bg:#3E2830; --k-sal:#C9BCE6; --k-sal-bg:#342C44;
  --shadow:0 6px 22px rgb(0 0 0 / .35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1416; --surface:#2A1D20; --surface-2:#332428; --line:#432F34;
  --ink:#F7E9EC; --muted:#B79CA2; --accent:#E58FA5; --accent-dark:#F0A9BA; --accent-ink:#1D1416; --accent-soft:#4A2A33;
  --ok:#8CC9A3; --ok-bg:#1F3428; --warn:#E9BE73; --warn-bg:#3B2C17; --bad:#F2928A; --bad-bg:#4B1F1D;
  --k-rep:#F0A9BA; --k-rep-bg:#4A2A33; --k-not:#E2C08E; --k-not-bg:#3A2D1F; --k-pay:#E3C3CE; --k-pay-bg:#3E2830; --k-sal:#C9BCE6; --k-sal-bg:#342C44;
  --shadow:0 6px 22px rgb(0 0 0 / .35);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{display:none}
.eyebrow{display:inline-block;width:max-content;background:var(--accent);color:var(--accent-ink);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.brand .tt{display:grid;gap:6px;min-width:0}
.brand h1{font:800 21px/1.15 var(--f-display);margin:0;color:var(--ink);letter-spacing:-.01em}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand .today{font-size:12px;color:var(--muted)}
.months{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.months::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.mchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.mchip .y{opacity:.6;font-size:11px;margin-left:3px}

main{padding-block:14px 110px}
.view{display:grid;gap:12px}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:16px;padding:10px 10px 9px;display:grid;gap:2px;min-width:0}
.stat b{font:800 24px/1.1 var(--f-display)}
.stat span{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}
@media (max-width:460px){.summary{grid-template-columns:repeat(2,1fr)}}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:auto}
.switch input{accent-color:var(--accent);width:18px;height:18px}

.card{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden}
.firm-head{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:16px 18px;width:100%;text-align:left;border:0;background:transparent}
.firm-head h3{margin:0;font-size:17px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.firm-head .meta{font-size:12px;color:var(--muted);grid-column:1}
.firm-head .count{grid-row:1 / span 2;grid-column:2;align-self:center;text-align:right;font-size:12px;color:var(--muted)}
.firm-head .count b{display:block;font:700 17px/1.1 var(--f-display);color:var(--accent-dark)}
.bar{height:6px;background:var(--surface-2);grid-column:1 / -1;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.flags{display:flex;gap:6px;flex-wrap:wrap;grid-column:1 / -1;margin-top:4px}
.flag{font-size:9px;padding:3px 9px;border-radius:999px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.flag.bad{background:var(--bad-bg);color:var(--bad)} .flag.warn{background:var(--warn-bg);color:var(--warn)} .flag.ok{background:var(--ok-bg);color:var(--ok)}

.tasks{border-top:1px solid var(--line)}
.task{display:grid;grid-template-columns:28px 66px 1fr;gap:4px 10px;align-items:start;padding:12px 18px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task.done{opacity:.55}
.task.done .tname{text-decoration:line-through;text-decoration-color:var(--muted)}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;margin-top:1px}
.check svg{width:14px;height:14px;opacity:0}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.check[aria-checked="true"] svg{opacity:1;stroke:#fff}
.due{font-size:13px;font-weight:700;padding:3px 0;border-radius:8px;text-align:center;background:var(--surface-2);white-space:nowrap}
.due.bad{background:var(--bad-bg);color:var(--bad)} .due.warn{background:var(--warn-bg);color:var(--warn)} .due.ok{background:var(--ok-bg);color:var(--ok)}
.tbody{min-width:0;display:grid;gap:3px}
.tname{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.tsub{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kind{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:1px 6px;border-radius:5px}
.kind.r{background:var(--k-rep-bg);color:var(--k-rep)} .kind.n{background:var(--k-not-bg);color:var(--k-not)} .kind.p{background:var(--k-pay-bg);color:var(--k-pay)} .kind.s{background:var(--k-sal-bg);color:var(--k-sal)}
details.note summary{font-size:12px;color:var(--accent);cursor:pointer;list-style:none;width:max-content}
details.note summary::-webkit-details-marker{display:none}
details.note p{margin:4px 0 0;font-size:12px;color:var(--muted)}
details.note p.flagtxt{color:var(--warn)}

.ctrl{border-top:1px solid var(--line);background:var(--surface-2);padding:14px 18px 16px;display:grid;gap:10px}
.ctrl h4{margin:0;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);width:max-content;padding:4px 10px;border-radius:999px}
.ctrl-checks{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.pill[aria-pressed="true"]{background:var(--ok-bg);border-color:transparent;color:var(--ok);font-weight:600}
.bank{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bank label{display:grid;gap:3px;font-size:11px;color:var(--muted)}
.bank input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:right}
.diff{grid-column:1 / -1;font-size:13px;padding:7px 10px;border-radius:10px;background:var(--surface);display:flex;justify-content:space-between}
.diff.ok{background:var(--ok-bg);color:var(--ok);font-weight:600} .diff.bad{background:var(--bad-bg);color:var(--bad);font-weight:600}

.dgroup{display:grid;gap:8px}
.dhead{display:flex;align-items:baseline;gap:10px;padding:4px 2px 0}
.dhead b{font:800 18px var(--f-display);color:var(--accent)}
.dhead span{font-size:12px;color:var(--muted)}
.dtask{padding:14px 18px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.dtask:last-child{border-bottom:0}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:600}
.fchip[aria-pressed="true"]::before{content:"✓"}

.empty{background:var(--surface);box-shadow:var(--shadow);border:0;border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty h2{margin:0;font:800 22px/1.2 var(--f-display);color:var(--accent);text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:44ch}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:background .15s}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}

.flist{display:grid;gap:8px}
.fitem{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)!important;width:100%;text-align:left;border:0;background:transparent}
.fitem .t{flex:1;min-width:0}
.fitem .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.fitem .t span{font-size:12px;color:var(--muted)}
.fitem .chev{color:var(--muted)}

form.ff{display:grid;gap:16px;background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:var(--r);padding:20px 18px}
form.ff h2{margin:0;font:800 21px var(--f-display);color:var(--ink)}
.fld{display:grid;gap:6px}
.fld > span{font-size:12px;color:var(--muted);font-weight:500}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.fld textarea{min-height:60px;resize:vertical}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.toggles{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tg{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.tg:last-child{border-bottom:0}
.tg b{font-weight:500;font-size:14px} .tg small{grid-column:1;color:var(--muted);font-size:12px}
.tg .sw{grid-row:1 / span 2;grid-column:2;width:46px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0}
.tg .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .15s}
.tg .sw[aria-checked="true"]{background:var(--accent)}
.tg .sw[aria-checked="true"]::after{left:21px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px;display:grid;gap:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-block:6px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:8px 4px;font-size:12px;color:var(--muted);display:grid;justify-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-pressed="true"]{color:var(--accent-dark);background:var(--accent-soft);font-weight:600}

.notice{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.backup{padding:18px;display:grid;gap:10px}
.backup h4{margin:0;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);width:max-content;padding:4px 10px;border-radius:999px}
.backup p{margin:0;font-size:13px;color:var(--muted)}
label.btn{display:inline-block;cursor:pointer}
.sign a{color:inherit;text-decoration:none}
.legend{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.sign{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="wrap">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span class="tt"><h1>Сроки <em>по фирмам</em></h1><span class="today num" id="today"></span></span></div>

<main class="wrap">

const MONTHS = [[2026,11],[2026,12]].concat(Array.from({length:12},(_,i)=>[2027,i+1]));
const REGIMES = ['ОСНО','УСН Доходы 6%','УСН Доходы-Расходы 15%','АУСН','ПСН','ПСН + УСН'];
const KIND = {'Отчёт':['r','Отчёт'],'Уведомление':['n','Уведомл.'],'Уплата':['p','Уплата'],'Выплата':['s','Выплата']};

// ---------- даты ----------
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const ddmm = s => s.slice(8,10) + '.' + s.slice(5,7);
const working = d => { const s = iso(d); if (WSAT.has(s)) return true; const w = d.getDay(); return w !== 0 && w !== 6 && !HOL.has(s); };
const prevWorking = d => { const x = new Date(d); while (!working(x)) x.setDate(x.getDate()-1); return x; };
const TODAY = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const TODAY_S = iso(TODAY);
const daysTo = s => Math.round((parse(s) - TODAY) / 86400000);

// ---------- кому что положено (те же правила, что в Excel) ----------
function applies(t, f) {
  const R = f.regime || '';
  const reg = { O: R === 'ОСНО', U: R.startsWith('УСН') || R === 'ПСН + УСН', A: R === 'АУСН', P: R.startsWith('ПСН') };
  const NDS = (R === 'ОСНО' || f.nds) && R !== 'АУСН';
  const n = t.n, tags = t.g;
  let ok;
  if (n.startsWith('Журнал учёта счетов-фактур')) ok = !!f.broker;
  else if (n.startsWith('Расчёт о доходах')) ok = !!f.agent;
  else if (n.startsWith('Декларация по НДС — налоговый агент')) ok = !!f.agent && !NDS;
  else if (n.startsWith('Отчёт о движении средств')) ok = !!f.abroad;
  else if (t.pr) {
    const J = f.profit || '';
    ok = reg.O && (t.pr === 'все' || (t.pr === 'кварт · мес' && J !== 'по факту') || (t.pr === 'мес' && J === 'ежемесячные') || (t.pr === 'факт' && J === 'по факту'));
  } else {
    const regs = 'OUAP'.split('').filter(c => tags.includes(c));
    ok = regs.length ? regs.some(c => reg[c]) : true;
    if (tags.includes('E')) ok = ok && !!f.emp && R !== 'АУСН';
    if (tags.includes('V') && tags.length <= 2) ok = ok && !!f.eaeu;
    if (tags.includes('I')) ok = ok && !!f.prop;
    if (tags.includes('N') && !regs.length) ok = ok && NDS;
  }
  if (t.w === 'ООО') ok = ok && f.form === 'ООО';
  if (t.w === 'ИП') ok = ok && f.form === 'ИП';
  return ok;
}
function salaryTasks(f, y, m) {
  if (!f.emp || f.regime === 'АУСН' && false) {}
  const out = [];
  if (!f.emp) return out;
  const last = new Date(y, m, 0).getDate();
  [['adv','Аванс сотрудникам', f.advDay], ['pay','Зарплата сотрудникам', f.payDay]].forEach(([id, name, day]) => {
    const n = parseInt(day, 10); if (!n) return;
    const d = prevWorking(new Date(y, m-1, Math.min(n, last)));
    const s = iso(d);
    out.push({ k: `${id}-${y}${String(m).padStart(2,'0')}`, d: s, s, b: '', t: 'Выплата', n: name, p: `${MON[m-1]} ${y}`, w: '', g: '', pr: '', no: 'Если день выплаты — выходной, платят накануне (ст. 136 ТК РФ).', f: '' });
  });
  return out;
}
function tasksFor(f, y, m) {
  const pre = `${y}-${String(m).padStart(2,'0')}`;
  return TASKS.filter(t => t.d.startsWith(pre) && applies(t, f)).concat(salaryTasks(f, y, m))
    .sort((a, b) => a.s.localeCompare(b.s) || a.d.localeCompare(b.d) || a.n.localeCompare(b.n));
}

// ---------- хранилище ----------
const state = { firms: [], marks: {}, view: 'month', month: null, showDone: true, open: new Set(), editing: null, confirmDel: false, ready: false };
let store = null;   // {saveFirm, deleteFirm, saveMarks}
const LS = 'sroki-local-v1';
function lsLoad() { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch { return null; } }
function lsSave() { try { localStorage.setItem(LS, JSON.stringify({ firms: state.firms, marks: state.marks })); return true; } catch { return false; } }

const writeQueue = new Map();   // путь -> промис цепочки (одна запись на документ за раз)
function serial(key, fn) {
  const prev = writeQueue.get(key) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  writeQueue.set(key, next);
  return next;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1800); }
function notice(msg) { const n = document.getElementById('notice'); n.textContent = msg || ''; n.hidden = !msg; }

async function initStore() {
  const saved = lsLoad();
  if (saved) { state.firms = saved.firms || []; state.marks = saved.marks || {}; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  store = {
    saveFirm: async f => { const i = state.firms.findIndex(x => x.id === f.id); if (i >= 0) state.firms[i] = f; else state.firms.push(f); if (!lsSave()) throw new Error('ls'); },
    deleteFirm: async id => { state.firms = state.firms.filter(x => x.id !== id); delete state.marks[id]; if (!lsSave()) throw new Error('ls'); },
    saveMarks: async id => { if (!lsSave()) throw new Error('ls'); },
  };
  if (!lsOk()) notice('Браузер не даёт сохранять данные (возможно, включён приватный режим). Открой страницу в обычном режиме.');
  state.ready = true; render();
}
function lsOk() { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch { return false; } }
// ---------- резервная копия ----------
function exportData() {
  const data = { app: 'sroki-po-firmam', version: 1, saved: new Date().toISOString(), firms: state.firms, marks: state.marks };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `sroki-kopiya-${TODAY_S}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  try { localStorage.setItem(LS + '-backup', TODAY_S); } catch {}
  toast('Копия сохранена в «Загрузки»'); render();
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.firms)) throw 0;
      state.firms = d.firms; state.marks = d.marks || {}; lsSave(); state.importAsk = false; render(); toast(`Загружено фирм: ${d.firms.length}`);
    } catch { toast('Это не файл копии из приложения'); }
  };
  r.readAsText(file);
}
const strip = f => { const o = { ...f }; delete o.id; return o; };
async function persist(p, okMsg) {
  try { await p; if (okMsg) toast(okMsg); }
  catch (e) {
    if (e && e.code === 'invalid_argument') notice('У вас нет прав менять данные на этой странице — можно только смотреть.');
    else if (e && e.code === 'quota_exceeded') notice('Хранилище заполнено: удалите лишние фирмы.');
    else toast('Не сохранилось: браузер не даёт записывать данные.');
  }
}

// ---------- отметки ----------
const marksOf = id => (state.marks[id] ||= { t: {}, c: {} });
const isDone = (fid, k) => !!(state.marks[fid]?.t?.[k]);
function toggleDone(fid, k) {
  const m = marksOf(fid); m.t ||= {};
  if (m.t[k]) delete m.t[k]; else m.t[k] = 1;
  render(); persist(store.saveMarks(fid));
}
const mkey = () => `${state.month[0]}-${String(state.month[1]).padStart(2,'0')}`;
function ctrlOf(fid) { const m = marksOf(fid); m.c ||= {}; return (m.c[mkey()] ||= {}); }
function readCtrl(fid) { return state.marks[fid]?.c?.[mkey()] || {}; }

// ---------- отрисовка ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function dueClass(t, done) { if (done) return 'ok'; const n = daysTo(t.s); return n < 0 ? 'bad' : n <= 3 ? 'warn' : ''; }
const fmtRub = v => (v === '' || v == null || isNaN(v)) ? '' : Number(v).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const firmMeta = f => [f.form, f.regime, f.nds && f.regime !== 'ОСНО' ? 'с НДС' : '', f.emp ? 'сотрудники' : '', f.eaeu ? 'ЕАЭС' : ''].filter(Boolean).join(' · ');
const sortedFirms = () => state.firms.slice().sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));

function renderMonths() {
  const box = document.getElementById('months');
  box.innerHTML = MONTHS.map(([y, m]) => `<button class="mchip" data-y="${y}" data-m="${m}" aria-pressed="${state.month[0]===y && state.month[1]===m}">${MON_S[m-1]}<span class="y">${String(y).slice(2)}</span></button>`).join('');
  const cur = box.querySelector('[aria-pressed="true"]'); if (cur && !renderMonths._done) { cur.scrollIntoView({ inline: 'center', block: 'nearest' }); renderMonths._done = true; }
}

function emptyState() {
  return `<div class="empty">
    <h2>Добавь первую фирму</h2>
    <p>Укажи режим и пару признаков — приложение само соберёт её сроки на каждый месяц, с переносами выходных и датой «сдать до» за 3 дня.</p>
    <div class="row"><button class="btn" data-act="new">Добавить фирму</button><button class="btn ghost" data-act="demo">Показать на примере</button></div>
  </div>`;
}

function taskRow(t, fid) {
  const done = isDone(fid, t.k), [kc, kl] = KIND[t.t];
  const notes = [t.b ? `Срок по НК ${ddmm(t.b)} — выходной, перенесён на ${ddmm(t.d)}.` : '', t.no].filter(Boolean);
  const note = (notes.length || t.f) ? `<details class="note"><summary>Пояснение</summary>${notes.map(x => `<p>${esc(x)}</p>`).join('')}${t.f ? `<p class="flagtxt">${esc(t.f)}</p>` : ''}</details>` : '';
  return `<div class="task${done ? ' done' : ''}">
    <button class="check" role="checkbox" aria-checked="${done}" aria-label="Отметить: ${esc(t.n)}" data-act="tick" data-f="${fid}" data-k="${t.k}">${CHECK}</button>
    <div class="due num ${dueClass(t, done)}">${t.t === 'Выплата' ? '' : 'до '}${ddmm(t.s)}</div>
    <div class="tbody"><div class="tname">${esc(t.n)}</div>
      <div class="tsub"><span class="kind ${kc}">${kl}</span><span>${esc(t.p)}</span>${t.t !== 'Выплата' ? `<span class="num">срок ${ddmm(t.d)}</span>` : ''}</div>${note}</div>
  </div>`;
}

function ctrlBlock(f) {
  const c = readCtrl(f.id);
  const has = v => v !== undefined && v !== '' && v !== null;
  let diff = '<div class="diff"><span>Расхождение</span><span>впиши обе суммы</span></div>';
  if (has(c.bank) && has(c.acc)) {
    const d = Math.round((Number(c.bank) - Number(c.acc)) * 100) / 100;
    diff = d === 0 ? '<div class="diff ok"><span>Расхождение</span><span>✓ 0 — сходится</span></div>'
                   : `<div class="diff bad"><span>Расхождение банк − 51</span><span class="num">${fmtRub(d)} ₽</span></div>`;
  }
  const P = (key, lab) => `<button class="pill" aria-pressed="${!!c[key]}" data-act="ctrl" data-f="${f.id}" data-c="${key}">${c[key] ? '✓ ' : ''}${lab}</button>`;
  return `<div class="ctrl"><h4>Контроль за ${MON[state.month[1]-1]}</h4>
    <div class="ctrl-checks">${P('sales','Выписка реализаций')}${P('osv','Проверка ОСВ')}${P('month','Контроль месяца')}</div>
    <div class="bank">
      <label for="bank-${f.id}">Остаток по выписке, ₽<input id="bank-${f.id}" class="num" inputmode="decimal" data-act="amt" data-f="${f.id}" data-c="bank" value="${has(c.bank) ? fmtRub(c.bank) : ''}" placeholder="0,00"></label>
      <label for="acc-${f.id}">Остаток сч. 51, ₽<input id="acc-${f.id}" class="num" inputmode="decimal" data-act="amt" data-f="${f.id}" data-c="acc" value="${has(c.acc) ? fmtRub(c.acc) : ''}" placeholder="0,00"></label>
      ${diff}
    </div></div>`;
}

function renderMonth() {
  const el = document.getElementById('v-month');
  const [y, m] = state.month;
  if (!state.ready) { el.innerHTML = '<div class="empty"><p>Загружаю фирмы…</p></div>'; return; }
  if (!state.firms.length) { el.innerHTML = emptyState(); return; }
  let tot = 0, dn = 0, bad = 0, warn = 0;
  const cards = sortedFirms().map(f => {
    const ts = tasksFor(f, y, m);
    const d = ts.filter(t => isDone(f.id, t.k)).length;
    const b = ts.filter(t => !isDone(f.id, t.k) && daysTo(t.s) < 0).length;
    const w = ts.filter(t => !isDone(f.id, t.k) && daysTo(t.s) >= 0 && daysTo(t.s) <= 3).length;
    tot += ts.length; dn += d; bad += b; warn += w;
    const open = state.open.has(f.id);
    const shown = state.showDone ? ts : ts.filter(t => !isDone(f.id, t.k));
    const flags = [b ? `<span class="flag bad">просрочено ${b}</span>` : '', w ? `<span class="flag warn">горит ${w}</span>` : '', ts.length && d === ts.length ? '<span class="flag ok">всё сдано</span>' : ''].join('');
    return `<article class="card">
      <button class="firm-head" data-act="open" data-f="${f.id}" aria-expanded="${open}">
        <h3>${esc(f.name || 'Без названия')}</h3>
        <span class="count num"><b>${d}/${ts.length}</b>сделано</span>
        <span class="meta">${esc(firmMeta(f))}</span>
        <span class="bar"><i style="width:${ts.length ? Math.round(d / ts.length * 100) : 0}%"></i></span>
        ${flags ? `<span class="flags">${flags}</span>` : ''}
      </button>
      ${open ? `<div class="tasks">${shown.length ? shown.map(t => taskRow(t, f.id)).join('') : `<div class="task"><span></span><span></span><span class="tsub">${ts.length ? 'Всё сделано — скрыто фильтром.' : 'В этом месяце сроков нет.'}</span></div>`}</div>${ctrlBlock(f)}` : ''}
    </article>`;
  }).join('');
  el.innerHTML = `
    <div class="summary">
      <div class="stat"><b class="num">${tot}</b><span>задач в месяце</span></div>
      <div class="stat ok"><b class="num">${dn}</b><span>сделано</span></div>
      <div class="stat warn"><b class="num">${warn}</b><span>≤ 3 дней</span></div>
      <div class="stat bad"><b class="num">${bad}</b><span>просрочено</span></div>
    </div>
    <div class="toolbar">
      <div class="seg"><button data-act="openall" aria-pressed="false">Раскрыть все</button><button data-act="closeall" aria-pressed="false">Свернуть</button></div>
      <label class="switch" for="showdone"><input type="checkbox" id="showdone" ${state.showDone ? 'checked' : ''}>Показывать сделанное</label>
    </div>
    ${cards}
    <div class="legend"><span><i style="background:var(--warn-bg)"></i>до «сдать до» ≤ 3 дней</span><span><i style="background:var(--bad-bg)"></i>просрочено</span><span>«до» = за 3 дня до крайнего срока</span><span>сроки сверены на 28.10.2026</span></div>
    <div class="sign"><a href="https://www.instagram.com/is_karisha/" target="_blank" rel="noopener">is_karisha · бухгалтер для ИП и селлеров</a><span>→</span></div>`;
}

function renderDates() {
  const el = document.getElementById('v-dates');
  const [y, m] = state.month;
  if (!state.ready) { el.innerHTML = ''; return; }
  if (!state.firms.length) { el.innerHTML = emptyState(); return; }
  const map = new Map();
  sortedFirms().forEach(f => tasksFor(f, y, m).forEach(t => {
    const key = t.k;
    if (!map.has(key)) map.set(key, { t, firms: [] });
    map.get(key).firms.push(f);
  }));
  const items = [...map.values()].filter(x => state.showDone || x.firms.some(f => !isDone(f.id, x.t.k)));
  if (!items.length) { el.innerHTML = '<div class="empty"><h2>Пусто</h2><p>В этом месяце у твоих фирм сроков нет — или всё уже сделано.</p></div>'; return; }
  const groups = new Map();
  items.sort((a, b) => a.t.s.localeCompare(b.t.s) || a.t.n.localeCompare(b.t.n)).forEach(x => { if (!groups.has(x.t.s)) groups.set(x.t.s, []); groups.get(x.t.s).push(x); });
  const WD = ['вс','пн','вт','ср','чт','пт','сб'];
  el.innerHTML = `<div class="toolbar"><span class="tsub">Сгруппировано по дате «сдать до». Нажми на фирму — отметишь сделанное.</span>
      <label class="switch" for="showdone2"><input type="checkbox" id="showdone2" ${state.showDone ? 'checked' : ''}>Сделанное</label></div>` +
    [...groups.entries()].map(([s, arr]) => {
      const n = daysTo(s);
      const when = n < 0 ? `просрочено на ${-n} дн.` : n === 0 ? 'сегодня' : `через ${n} дн.`;
      return `<div class="dgroup"><div class="dhead"><b class="num">до ${ddmm(s)}</b><span>${WD[parse(s).getDay()]} · ${when}</span></div>
        <div class="card">${arr.map(({ t, firms }) => {
          const [kc, kl] = KIND[t.t];
          return `<div class="dtask"><div class="tbody"><div class="tname">${esc(t.n)}</div>
            <div class="tsub"><span class="kind ${kc}">${kl}</span><span>${esc(t.p)}</span>${t.t !== 'Выплата' ? `<span class="num">срок ${ddmm(t.d)}</span>` : ''}</div></div>
            <div class="fchips">${firms.map(f => `<button class="fchip" aria-pressed="${isDone(f.id, t.k)}" data-act="tick" data-f="${f.id}" data-k="${t.k}">${esc(f.name || 'Без названия')}</button>`).join('')}</div></div>`;
        }).join('')}</div></div>`;
    }).join('');
}

const BLANK = { name: '', form: 'ООО', regime: 'УСН Доходы 6%', nds: false, emp: false, eaeu: false, prop: false, advDay: '', payDay: '', profit: 'квартальные', agent: false, abroad: false, broker: false, comment: '' };
const TOGGLES = [
  ['nds', 'Плательщик НДС', 'Для УСН — если доход больше 20 млн. На ОСНО НДС учитывается всегда'],
  ['emp', 'Есть сотрудники', 'НДФЛ, взносы, РСВ, ПСВ, 6-НДФЛ, ЕФС-1, аванс и зарплата'],
  ['eaeu', 'Торговля с ЕАЭС', 'Ввоз или вывоз: статформа, декларация по косвенным налогам'],
  ['prop', 'Имущество', 'Транспорт, земля, недвижимость (для ООО)'],
  ['agent', 'Платит иностранцам', 'Налоговый агент: НДС за услуги иностранцев, расчёт о доходах'],
  ['abroad', 'Счёт за рубежом', 'Отчёт о движении средств (ОДДС)'],
  ['broker', 'Посредник', 'Комиссионер или агент — журнал учёта счетов-фактур'],
];
function renderFirms() {
  const el = document.getElementById('v-firms');
  if (state.editing) {
    const f = state.editing;
    const opt = (key, val, lab = val) => `<button type="button" class="opt" aria-pressed="${f[key] === val}" data-act="set" data-key="${key}" data-val="${esc(val)}">${esc(lab)}</button>`;
    const isNew = !state.firms.some(x => x.id === f.id);
    el.innerHTML = `<form class="ff" id="firmform">
      <h2>${isNew ? 'Новая фирма' : 'Фирма'}</h2>
      <label class="fld" for="f-name"><span>Название</span><input type="text" id="f-name" value="${esc(f.name)}" placeholder="ООО «Ромашка» или ИП Иванова" autocomplete="off"></label>
      <div class="fld"><span>Форма</span><div class="opts">${opt('form','ООО')}${opt('form','ИП')}</div></div>
      <div class="fld"><span>Режим</span><div class="opts">${REGIMES.map(r => opt('regime', r)).join('')}</div></div>
      ${f.form === 'ООО' && f.regime === 'ОСНО' ? `<div class="fld"><span>Авансы по налогу на прибыль</span><div class="opts">${opt('profit','квартальные')}${opt('profit','ежемесячные','ежемесячные + доплата')}${opt('profit','по факту','по фактической прибыли')}</div></div>` : ''}
      <div class="fld"><span>Что есть у фирмы</span><div class="toggles">${TOGGLES.map(([k, b, s]) => `<div class="tg"><b>${b}</b><small>${s}</small><button type="button" class="sw" role="switch" aria-checked="${!!f[k]}" aria-label="${b}" data-act="flip" data-key="${k}"></button></div>`).join('')}</div></div>
      ${f.emp ? `<div class="two"><label class="fld" for="f-adv"><span>День аванса</span><input type="number" id="f-adv" min="1" max="31" inputmode="numeric" value="${esc(f.advDay)}" placeholder="25"></label>
        <label class="fld" for="f-pay"><span>День зарплаты</span><input type="number" id="f-pay" min="1" max="31" inputmode="numeric" value="${esc(f.payDay)}" placeholder="10"></label></div>` : ''}
      <label class="fld" for="f-com"><span>Комментарий</span><textarea id="f-com" placeholder="Озон, закупка в Казахстане…">${esc(f.comment)}</textarea></label>
      <div class="row"><button class="btn" type="submit">Сохранить</button><button class="btn ghost" type="button" data-act="cancel">Отмена</button>
        ${isNew ? '' : '<button class="btn danger" type="button" data-act="askdel" style="margin-left:auto">Удалить</button>'}</div>
      ${state.confirmDel ? `<div class="confirm"><b>Удалить «${esc(f.name || 'фирму')}» вместе со всеми отметками?</b><div class="row"><button class="btn danger" type="button" data-act="del">Да, удалить</button><button class="btn ghost" type="button" data-act="nodel">Нет</button></div></div>` : ''}
    </form>`;
    return;
  }
  if (!state.ready) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="toolbar"><span class="tsub">${state.firms.length ? `Фирм: ${state.firms.length}` : ''}</span><button class="btn" data-act="new" style="margin-left:auto">+ Добавить фирму</button></div>` +
    (state.firms.length ? `<div class="card flist">${sortedFirms().map(f => `<button class="fitem" data-act="edit" data-f="${f.id}"><span class="t"><b>${esc(f.name || 'Без названия')}</b><span>${esc(firmMeta(f))}</span></span><span class="chev">›</span></button>`).join('')}</div>` : emptyState()) + backupBlock();
}
function backupBlock() {
  let last = ''; try { last = localStorage.getItem(LS + '-backup') || ''; } catch {}
  return `<div class="card backup"><h4>Копия данных</h4>
    <p>Фирмы и отметки хранятся только на этом устройстве. Раз в месяц сохраняй копию — так данные не пропадут, и их можно перенести на другой телефон или компьютер.</p>
    <p class="tsub">${last ? 'Последняя копия: ' + ddmm(last) + '.' + last.slice(0, 4) : 'Копию ещё не сохраняли.'}</p>
    <div class="row"><button class="btn" data-act="export">Сохранить копию</button>
    <label class="btn ghost" for="importfile">Загрузить копию</label><input type="file" id="importfile" accept=".json,application/json" hidden></div>
    ${state.firms.length && state.importAsk ? '' : ''}
  </div>`;
}

function render() {
  if (!state.month) return;
  renderMonths();
  ['month','dates','firms'].forEach(v => { document.getElementById('v-' + v).hidden = state.view !== v; document.getElementById('tab-' + v).setAttribute('aria-pressed', state.view === v); });
  document.getElementById('months').parentElement.querySelector('.months').style.display = state.view === 'firms' ? 'none' : '';
  if (state.view === 'month') renderMonth();
  if (state.view === 'dates') renderDates();
  if (state.view === 'firms') renderFirms();
}

// ---------- действия ----------
function readForm() {
  const f = state.editing, g = id => document.getElementById(id);
  if (g('f-name')) f.name = g('f-name').value.trim();
  if (g('f-adv')) f.advDay = g('f-adv').value;
  if (g('f-pay')) f.payDay = g('f-pay').value;
  if (g('f-com')) f.comment = g('f-com').value;
}
const newId = () => 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const DEMO = [
  { name: 'Пример: ООО «Трейд»', form: 'ООО', regime: 'УСН Доходы 6%', nds: true, emp: true, eaeu: true, advDay: '25', payDay: '10', comment: 'Пример — Озон + закупка в Казахстане. Можно удалить.' },
  { name: 'Пример: ИП Смирнова', form: 'ИП', regime: 'АУСН', comment: 'Пример — можно удалить.' },
];
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act], .mchip, nav.tabs button'); if (!b) return;
  if (b.classList.contains('mchip')) { state.month = [+b.dataset.y, +b.dataset.m]; render(); return; }
  if (b.closest('nav.tabs')) { state.view = b.dataset.v; state.editing = null; state.confirmDel = false; render(); window.scrollTo(0, 0); return; }
  const a = b.dataset.act, fid = b.dataset.f;
  if (a === 'tick') toggleDone(fid, b.dataset.k);
  else if (a === 'open') { state.open.has(fid) ? state.open.delete(fid) : state.open.add(fid); render(); }
  else if (a === 'openall') { state.firms.forEach(f => state.open.add(f.id)); render(); }
  else if (a === 'closeall') { state.open.clear(); render(); }
  else if (a === 'ctrl') { const c = ctrlOf(fid); c[b.dataset.c] = !c[b.dataset.c]; render(); persist(store.saveMarks(fid)); }
  else if (a === 'new') { state.view = 'firms'; state.editing = { ...BLANK, id: newId() }; state.confirmDel = false; render(); window.scrollTo(0, 0); }
  else if (a === 'edit') { state.editing = { ...BLANK, ...state.firms.find(x => x.id === fid) }; state.confirmDel = false; render(); window.scrollTo(0, 0); }
  else if (a === 'set') { readForm(); state.editing[b.dataset.key] = b.dataset.val; render(); }
  else if (a === 'flip') { readForm(); const k = b.dataset.key; state.editing[k] = !state.editing[k]; render(); }
  else if (a === 'export') exportData();
  else if (a === 'cancel') { state.editing = null; render(); }
  else if (a === 'askdel') { readForm(); state.confirmDel = true; render(); }
  else if (a === 'nodel') { state.confirmDel = false; render(); }
  else if (a === 'del') { const id = state.editing.id; state.editing = null; state.confirmDel = false; state.firms = state.firms.filter(x => x.id !== id); render(); persist(store.deleteFirm(id), 'Фирма удалена'); }
  else if (a === 'demo') { DEMO.forEach(d => { const f = { ...BLANK, ...d, id: newId() }; state.firms.push(f); persist(store.saveFirm(f)); }); state.view = 'month'; state.firms.forEach(f => state.open.add(f.id)); render(); toast('Добавила 2 фирмы-примера'); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'firmform') return;
  e.preventDefault(); readForm();
  const f = { ...state.editing };
  if (!f.name) { document.getElementById('f-name').focus(); toast('Впиши название фирмы'); return; }
  if (!(f.form === 'ООО' && f.regime === 'ОСНО')) f.profit = '';
  else if (!f.profit) f.profit = 'квартальные';
  if (f.form === 'ИП') f.prop = false;
  const i = state.firms.findIndex(x => x.id === f.id); if (i >= 0) state.firms[i] = f; else state.firms.push(f);
  state.editing = null; state.open.add(f.id); render();
  persist(store.saveFirm(f), 'Сохранено');
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'importfile' && t.files && t.files[0]) { importData(t.files[0]); t.value = ''; return; }
  if (t.id === 'showdone' || t.id === 'showdone2') { state.showDone = t.checked; render(); return; }
  if (t.dataset.act === 'amt') {
    const raw = t.value.replace(/\s/g, '').replace(',', '.');
    const v = raw === '' ? '' : Number(raw);
    if (raw !== '' && isNaN(v)) { toast('Впиши сумму цифрами'); return; }
    const c = ctrlOf(t.dataset.f); if (c[t.dataset.c] === v) return;
    c[t.dataset.c] = v; render(); persist(store.saveMarks(t.dataset.f));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset?.act === 'amt') e.target.blur(); });

// ---------- старт ----------
const ti = MONTHS.findIndex(([y, m]) => y === TODAY.getFullYear() && m === TODAY.getMonth() + 1);
state.month = MONTHS[ti >= 0 ? ti : (TODAY < new Date(2026, 10, 1) ? 0 : MONTHS.length - 1)];
document.getElementById('today').textContent = 'сегодня ' + TODAY.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
render();
initStore();
})();
</script>

<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }</script>
</body>
</html>
